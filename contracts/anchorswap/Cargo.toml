[package]
name = "anchorswap"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Constant-product AMM for Stellar / Soroban"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
